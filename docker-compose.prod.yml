# Pull-only production stack for a small VM.
#
# Images are built/pushed from a developer machine with:
#   GHCR_OWNER=you NEXT_PUBLIC_API_URL=https://api.example.com pnpm run images:publish
#
# The VM deploys an immutable tag with:
#   bash scripts/deploy-images-vm.sh <git-sha-tag>
#
# No build sections exist here, so the VM never compiles the applications.

x-db-url: &db-url
  DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}@db:5432/${DB_NAME:-appdb}

x-image-base: &image-base
  pull_policy: always

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  migrate:
    <<: *image-base
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env.prod}/${IMAGE_PREFIX:-monno}-migrate:${IMAGE_TAG:?Set IMAGE_TAG or pass it to deploy-images-vm.sh}
    environment:
      <<: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  api:
    <<: *image-base
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env.prod}/${IMAGE_PREFIX:-monno}-api:${IMAGE_TAG:?Set IMAGE_TAG or pass it to deploy-images-vm.sh}
    restart: unless-stopped
    env_file:
      - path: ${API_ENV_FILE:-./env/api.env}
        required: false
    environment:
      <<: *db-url
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      LOCAL_UPLOAD_PATH: /app/uploads
    # Host nginx proxies to this. Do not expose it to the public network.
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app

  worker:
    <<: *image-base
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env.prod}/${IMAGE_PREFIX:-monno}-worker:${IMAGE_TAG:?Set IMAGE_TAG or pass it to deploy-images-vm.sh}
    restart: unless-stopped
    env_file:
      - path: ${WORKER_ENV_FILE:-./env/worker.env}
        required: false
    environment:
      <<: *db-url
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_UPLOAD_PATH: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app

  web:
    <<: *image-base
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env.prod}/${IMAGE_PREFIX:-monno}-web:${IMAGE_TAG:?Set IMAGE_TAG or pass it to deploy-images-vm.sh}
    restart: unless-stopped
    environment:
      # RSC/SSR uses Docker DNS; browser URL was baked into the image locally.
      API_INTERNAL_URL: http://api:3001
    # Host nginx proxies to this. Do not expose it to the public network.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  db_data:
  redis_data:
  uploads:
